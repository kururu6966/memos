name: Deploy

on:
  push:
    branches:
      - custom

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-build
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # Build frontend
      - uses: pnpm/action-setup@v4.2.0
        with:
          package_json_file: "web/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: "web/pnpm-lock.yaml"
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm release
        working-directory: web

      # Build and push Docker image (amd64 for Oracle Cloud E2.1.Micro)
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          NEW_TAG: ghcr.io/${{ github.repository }}:${{ github.sha }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: IMAGE,NEW_TAG
          script: |
            DATA_DIR="/var/opt/memos"
            DB_FILE="memos_prod.db"

            # Record current image for rollback
            OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' memos 2>/dev/null || echo "")

            # Pull new image — fail fast without touching the running container
            docker pull "$NEW_TAG" || { echo "Pull failed, aborting deploy"; exit 1; }

            SQLITE_IMAGE="keinos/sqlite3:3.51.2@sha256:515cecccaed9a1140020cd4ce339b083830c46c09559ccbe0dd04eb02484c11f"
            docker pull "$SQLITE_IMAGE" || { echo "SQLite image pull failed, aborting"; exit 1; }

            # Backup SQLite database before deploy
            echo "Backing up database..."
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="${DATA_DIR}/backups/${DB_FILE}_${TIMESTAMP}"
            docker run --rm -v "${DATA_DIR}:${DATA_DIR}" "$SQLITE_IMAGE" sh -c "
              mkdir -p -m 750 '${DATA_DIR}/backups' &&
              sqlite3 '${DATA_DIR}/${DB_FILE}' \".backup '${BACKUP_FILE}'\" &&
              chmod 640 '${BACKUP_FILE}' &&
              [ -s '${BACKUP_FILE}' ]
            " || { echo "Backup failed, aborting deploy"; exit 1; }
            echo "Backup saved: ${BACKUP_FILE}"

            # Rotate backups (keep last 5)
            ls -1t "${DATA_DIR}/backups/${DB_FILE}_"* 2>/dev/null | tail -n +6 | xargs -r rm -f

            # Stop old container
            docker stop memos 2>/dev/null || true
            docker rm memos 2>/dev/null || true

            # Start new container
            docker run -d \
              --name memos \
              --restart unless-stopped \
              -p 5230:5230 \
              -v "${DATA_DIR}:${DATA_DIR}" \
              "$NEW_TAG"

            # Health check with retry — rollback if app is not healthy
            echo "Waiting for health check..."
            for i in $(seq 1 10); do
              if curl -sf http://localhost:5230/healthz > /dev/null 2>&1; then
                echo "Deploy successful (attempt $i)"
                # Clean up old images (keep latest and current)
                docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}}' | grep -v -e ":latest" -e ":${NEW_TAG##*:}" | xargs -r docker rmi 2>/dev/null || true
                docker image prune -f
                exit 0
              fi
              echo "Health check attempt $i failed, retrying in 3s..."
              sleep 3
            done

            echo "Deploy failed after 10 attempts, rolling back..."
            docker logs memos 2>/dev/null
            docker stop memos 2>/dev/null || true
            docker rm memos 2>/dev/null || true

            # Restore database from backup only if DB is corrupted (e.g. failed migration)
            if [ -n "$BACKUP_FILE" ] && [ -f "$BACKUP_FILE" ]; then
              DB_STATUS=$(docker run --rm -v "${DATA_DIR}:${DATA_DIR}" "$SQLITE_IMAGE" sh -c "
                sqlite3 '${DATA_DIR}/${DB_FILE}' 'PRAGMA integrity_check;'
              " 2>&1 || true)
              if [ "$DB_STATUS" != "ok" ]; then
                echo "Database integrity check failed: ${DB_STATUS}"
                echo "Restoring database from backup: ${BACKUP_FILE}"
                cp "$BACKUP_FILE" "${DATA_DIR}/${DB_FILE}"
                rm -f "${DATA_DIR}/${DB_FILE}-wal" "${DATA_DIR}/${DB_FILE}-shm"
                echo "Database restored"
              else
                echo "Database integrity OK, skipping restore"
              fi
            fi

            if [ -n "$OLD_IMAGE" ]; then
              docker run -d \
                --name memos \
                --restart unless-stopped \
                -p 5230:5230 \
                -v "${DATA_DIR}:${DATA_DIR}" \
                "$OLD_IMAGE"
              echo "Waiting for rollback health check..."
              for j in $(seq 1 5); do
                if curl -sf http://localhost:5230/healthz > /dev/null 2>&1; then
                  echo "Rollback successful (attempt $j)"
                  break
                fi
                sleep 3
              done
              echo "Rolled back to $OLD_IMAGE"
            fi
            exit 1
